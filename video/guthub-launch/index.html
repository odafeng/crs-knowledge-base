<!doctype html>
<html
  lang="zh-Hant-TW"
  data-composition-variables='[
    {"id":"brandName","type":"string","label":"Brand Name","default":"GutHub"},
    {"id":"siteDomain","type":"string","label":"Site Domain","default":"guthub.tw"},
    {"id":"lineId","type":"string","label":"LINE OA ID","default":"@742rxviu"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>GutHub｜大腸直腸外科實證更新</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        font-style: normal;
        font-weight: 100 900;
        src: url("assets/fonts/archivo-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "GutHubTC";
        font-style: normal;
        font-weight: 400 800;
        src: local("PingFang TC"), local("Heiti TC");
      }
      :root {
        --ground: #f6f5f0;
        --field: #0f1f44;
        --brand: #1a3a7e;
        --rose: #8f2542;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: "Archivo", "GutHubTC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      .scene-host {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="92"
      data-width="1920"
      data-height="1080"
    >
      <div
