components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, description: Opaque cursor returned by this endpoint; clients must not interpret it.}
    PaperId:
      name: paperId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    AccountId:
      name: accountId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CommentId:
      name: commentId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    PostId:
      name: postId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    NewsId:
      name: newsId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    TopicKey:
      name: topicKey
      in: path
      required: true
      schema: {$ref: '#/components/schemas/TopicKey'}
  schemas:
    TopicKey:
      type: string
      enum: [mCRC-BRAF-V600E, mCRC-KRAS-G12C, mCRC-MSI-H, mCRC-HER2, mCRC-RAS-wt, generic-CRS, robotic-surgery]
    Review:
      type: object
      additionalProperties: false
      required: [status, publishedAt]
      properties:
        status:
          type: string
          enum: [auto, accepted]
        publishedAt: {type: string, format: date}
    Relation:
      type: object
      additionalProperties: false
      required: [targetId, type]
      properties:
        targetId: {type: string, minLength: 1}
        type:
          type: string
          enum: [builds_on, supersedes, subgroup_of, same_regimen, contradicts]
    ResearchCommentary:
      type: object
      additionalProperties: false
      required: [title, journal, type, summary, critique, newData, addedAt]
      properties:
        doi:
          type: [string, 'null']
        pmid:
          type: [string, 'null']
        title: {type: string, minLength: 1}
        journal: {type: string, minLength: 1}
        year:
          type: [integer, 'null']
        type:
          type: string
          enum: [Editorial, Letter, News, Newspaper Article, Comment]
        summary: {type: string}
        critique: {type: boolean}
        newData: {type: boolean}
        addedAt: {type: string, format: date}
        review: {$ref: '#/components/schemas/Review'}
      anyOf:
      - required: [doi]
        properties:
          doi: {type: string, minLength: 1}
      - required: [pmid]
        properties:
          pmid: {type: string, minLength: 1}
    Paper:
      type: object
      additionalProperties: false
      required: [id, slug, topic, year, journal, studyType, regimen, endpoint, result, bottomLine, relations, source,
        reviewedAt, detailHtml]
      properties:
        id: {type: string, minLength: 1, description: Stable existing paper ID; preserve case and underscores.}
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]*$'}
        topic: {$ref: '#/components/schemas/TopicKey'}
        year: {type: integer}
        journal: {type: string, minLength: 1}
        studyType:
          type: string
          enum: [Biomarker (exploratory), Guideline, Meta-analysis, Phase 1, Phase 1-2, Phase 1-2 (expanded), Phase
              1b, Phase 2, Phase 2 (exploratory), Phase 2 (updated), Phase 2 RCT, Phase 2a (basket), Phase 3 (Cohort
              3), Phase 3 RCT, Phase 3 RCT (final OS), Phase 3 RCT (final), Phase 3 RCT (updated), Pooled analysis,
            Post-hoc analysis, Retrospective cohort]
        n:
          type: [integer, string, 'null']
        regimen: {type: string, minLength: 1}
        endpoint: {type: string, minLength: 1}
        result: {type: string, minLength: 1}
        bottomLine: {type: string, minLength: 1}
        doi:
          type: [string, 'null']
        relations:
          type: array
          items: {$ref: '#/components/schemas/Relation'}
        source:
          type: string
          enum: [fulltext, abstract, secondary, curated]
        reviewedAt: {type: string, format: date, description: When the numbers were last checked.}
        addedAt: {type: string, format: date, description: 'When Paper Watch found a hand-added paper (its review
            issue date). Lists date a paper by review.publishedAt, else addedAt, else reviewedAt.'}
        review: {$ref: '#/components/schemas/Review'}
        commentary:
          type: array
          items: {$ref: '#/components/schemas/ResearchCommentary'}
        detailHtml: {type: string, description: Detailed evidence retained from the source document; the API must
            sanitize HTML before returning it.}
    Stat:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: {type: string}
        value:
          type: [string, number]
        unit: {type: string}
    NewsSection:
      type: object
      additionalProperties: false
      required: [heading, text]
      properties:
        heading: {type: string}
        text: {type: string}
    CompareRow:
      type: object
      additionalProperties: false
      required: [label, unit, a, b]
      properties:
        label: {type: string}
        unit: {type: string}
        a: {type: number}
        b: {type: number}
    Meter:
      type: object
      additionalProperties: false
      required: [label, percent]
      properties:
        label: {type: string}
        percent: {type: number, minimum: 0, maximum: 100}
        detail: {type: string}
    Figure:
      oneOf:
      - {$ref: '#/components/schemas/NumbersFigure'}
      - {$ref: '#/components/schemas/CompareFigure'}
      - {$ref: '#/components/schemas/MetersFigure'}
      - {$ref: '#/components/schemas/IntervalFigure'}
      discriminator:
        propertyName: kind
        # Without a mapping, OpenAPI uses schema names ("IntervalFigure") as discriminator values; the data uses these.
        mapping:
          numbers: '#/components/schemas/NumbersFigure'
          compare: '#/components/schemas/CompareFigure'
          meters: '#/components/schemas/MetersFigure'
          interval: '#/components/schemas/IntervalFigure'
    NumbersFigure:
      type: object
      additionalProperties: false
      required: [kind, stats]
      properties:
        kind:
          type: string
          enum: [numbers]
        stats:
          type: array
          items: {$ref: '#/components/schemas/Stat'}
    CompareFigure:
      type: object
      additionalProperties: false
      required: [kind, armA, armB, rows]
      properties:
        kind:
          type: string
          enum: [compare]
        armA: {type: string}
        armB: {type: string}
        rows:
          type: array
          items: {$ref: '#/components/schemas/CompareRow'}
    MetersFigure:
      type: object
      additionalProperties: false
      required: [kind, rows]
      properties:
        kind:
          type: string
          enum: [meters]
        rows:
          type: array
          items: {$ref: '#/components/schemas/Meter'}
    IntervalFigure:
      type: object
      additionalProperties: false
      required: [kind, label, point, low, high]
      properties:
        kind:
          type: string
          enum: [interval]
        label: {type: string}
        point: {type: number}
        low: {type: number}
        high: {type: number}
        note: {type: string}
    News:
      type: object
      additionalProperties: false
      required: [id, paperId, publishedAt, headline, dek, key, figures, body, review]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9-]*$'}
        paperId: {type: string, minLength: 1}
        publishedAt: {type: string, format: date}
        headline:
          type: array
          items: {type: string}
        dek: {type: string}
        key: {$ref: '#/components/schemas/Stat'}
        figures:
          type: array
          items: {$ref: '#/components/schemas/Figure'}
        figureNote: {type: string}
        body:
          type: array
          items: {$ref: '#/components/schemas/NewsSection'}
        review: {$ref: '#/components/schemas/NewsReview'}
    RegulatoryRow:
      type: object
      additionalProperties: false
      required: [regimen, fda, tfda, nhi, checkedAt]
      properties:
        regimen: {type: string}
        fda:
          type: string
          enum: [approved, accelerated, none, unknown]
        tfda:
          type: string
          enum: [approved, none, unknown]
        nhi:
          type: string
          enum: [covered, conditional, none, unknown]
        fdaNote: {type: string}
        tfdaNote: {type: string}
        nhiNote: {type: string}
        nhiClause:
          type: string
          description: The NHI rule item, e.g. "9.69 1.(11)" or "9.134" for a whole chapter.
        nhiEffective:
          type: string
          format: date
          description: When the rule as it stands took effect, read from the clause's amendment dates.
        checkedAt: {type: string, format: date}
        sources:
          type: array
          items: {type: string, format: uri}
    SocCard:
      type: object
      additionalProperties: false
      required: [title, icon, body_html, reviewedAt, refs]
      properties:
        title: {type: string}
        icon: {type: string}
        body_html: {type: string}
        reviewedAt: {type: string, format: date}
        refs:
          type: array
          items: {type: string}
        regulatory:
          type: array
          items: {$ref: '#/components/schemas/RegulatoryRow'}
    TimelineItem:
      type: object
      additionalProperties: false
      required: [yr, venue, finding]
      properties:
        yr:
          type: [string, integer]
        venue: {type: string}
        finding: {type: string}
        file:
          type: [string, 'null']
        cls: {type: string, description: Legacy presentation hint; clients map only recognized values to local styles.}
    RoboticCard:
      type: object
      additionalProperties: false
      required: [title, tag, body]
      properties:
        title: {type: string}
        tag: {type: string}
        body: {type: string}
        cls: {type: string, description: Legacy presentation hint.}
    RoboticSection:
      type: object
      additionalProperties: false
      required: [slug, timeline, cards, detailHtml]
      properties:
        slug:
          type: string
          enum: [tme, anastomosis]
        timeline:
          type: array
          items: {$ref: '#/components/schemas/TimelineItem'}
        cards:
          type: array
          items: {$ref: '#/components/schemas/RoboticCard'}
        detailHtml:
          type: array
          items: {type: string}
    Topic:
      type: object
      additionalProperties: false
      required: [key, slug, label, title, paperCount, standardOfCare, roboticSections]
      properties:
        key: {$ref: '#/components/schemas/TopicKey'}
        slug: {type: string}
        label: {type: string}
        title: {type: string}
        paperCount: {type: integer, minimum: 0}
        standardOfCare:
          type: array
          items: {$ref: '#/components/schemas/SocCard'}
        roboticSections:
          type: array
          items: {$ref: '#/components/schemas/RoboticSection'}
    SearchHit:
      type: object
      additionalProperties: false
      required: [kind, id, path, title, summary]
      properties:
        kind:
          type: string
          enum: [paper, news]
        id: {type: string}
        path: {type: string, pattern: ^/}
        title: {type: string}
        summary: {type: string}
    PublicComment:
      type: object
      additionalProperties: false
      required: [id, paperId, body, anonymous, displayName, createdAt, updatedAt, likeCount]
      properties:
        id: {type: string}
        paperId: {type: string}
        body: {type: string, minLength: 1}
        anonymous: {type: boolean}
        displayName:
          type: [string, 'null']
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        likeCount: {type: integer, minimum: 0, description: Number of readers who liked it; who they are is never returned.}
      allOf:
      - if:
          properties:
            anonymous: {const: true}
        then:
          properties:
            displayName: {type: 'null'}
        else:
          properties:
            displayName: {type: string, minLength: 1}
    CommentCreate:
      type: object
      additionalProperties: false
      required: [body, anonymous]
      properties:
        body: {type: string, minLength: 1, maxLength: 2000, description: 'Plain text, not HTML; newlines and tabs are the
            only control characters allowed (ADR-0017).'}
        anonymous: {type: boolean, description: 'true hides the name from other readers; the platform keeps the author
            mapping for the author and moderators (ADR-0017).'}
    Account:
      type: object
      additionalProperties: false
      required: [displayName, isAdmin]
      properties:
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 80
          description: Public name chosen by the reader (ADR-0017); never taken from Google or the email address.
        isAdmin: {type: boolean}
    PushEndpoint:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint:
          type: string
          maxLength: 2048
          pattern: '^https://([a-z0-9-]+\.)*(googleapis\.com|mozilla\.com|push\.apple\.com|windows\.com)/'
          description: The browser vendor's push service URL from PushSubscription.toJSON().
    PushSubscription:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint: {$ref: '#/components/schemas/PushEndpoint/properties/endpoint'}
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: {type: string, pattern: '^[A-Za-z0-9_-]{80,100}$'}
            auth: {type: string, pattern: '^[A-Za-z0-9_-]{16,32}$'}
    WeeklyActivity:
      type: object
      additionalProperties: false
      required: [timezone, weeks]
      properties:
        timezone: {type: string, const: Asia/Taipei}
        weeks:
          type: array
          minItems: 12
          maxItems: 12
          description: Oldest first; the last one is the current week so far.
          items:
            type: object
            additionalProperties: false
            required: [week, activeReaders, newAccounts, comments, likes]
            properties:
              week: {type: string, format: date, description: The Monday the week starts on.}
              activeReaders: {type: integer, minimum: 0}
              newAccounts: {type: integer, minimum: 0}
              comments: {type: integer, minimum: 0}
              likes: {type: integer, minimum: 0, description: Likes given that week and still standing.}
    DailyPick:
      type: object
      additionalProperties: false
      required: [date, pick]
      properties:
        date: {type: string, format: date}
        pick:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required: [kind, title, conclusion, url, date, unreviewed]
            properties:
              kind: {type: string, enum: [regulatory, news, paper]}
              title: {type: string}
              conclusion: {type: string, description: An entry's existing bottom line.}
              url: {type: string, description: Path on the site.}
              date: {type: string, format: date}
              unreviewed: {type: boolean, description: True for AI-written entries not yet reviewed.}
    ContentRequest:
      type: object
      additionalProperties: false
      required: [action, kind, target]
      properties:
        action: {type: string, enum: [review, unpublish]}
        kind: {type: string, enum: [paper, news]}
        target: {type: string, minLength: 1, maxLength: 200, description: Paper or story id.}
    ContentRequestQueued:
      type: object
      additionalProperties: false
      required: [id, started]
      properties:
        id: {type: integer}
        started: {type: boolean}
    SurgeonMembership:
      type: object
      additionalProperties: false
      required: [status, since]
      properties:
        status: {type: string, enum: [none, pending, verified]}
        since: {type: [string, 'null'], format: date-time}
    SurgeonApplication:
      type: object
      additionalProperties: false
      required: [realName, hospital, certificateDigits]
      properties:
        realName: {type: string, minLength: 1, maxLength: 40}
        hospital: {type: string, minLength: 1, maxLength: 80}
        certificateDigits: {type: string, pattern: '^[0-9]{3}$', description: Last three digits of the certificate number.}
    SurgeonApplicationList:
      type: object
      additionalProperties: false
      required: [applications]
      properties:
        applications:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [accountId, displayName, realName, hospital, certificateDigits, submittedAt,
              hospitalEmail, roster]
            properties:
              accountId: {type: string, format: uuid}
              displayName: {type: string}
              realName: {type: string}
              hospital: {type: string}
              certificateDigits: {type: string, pattern: '^[0-9]{3}$'}
              submittedAt: {type: string, format: date-time}
              hospitalEmail:
                type: boolean
                description: The applicant signed in from a mailbox at the stated hospital's domain.
              roster:
                type: string
                enum: [listed, unlisted, unavailable]
                description: Whether the society's doctor map shows this name at this hospital.
    SemanticQuery:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 2, maxLength: 200}
    SemanticResults:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [kind, path, title, snippet, score]
            properties:
              kind: {type: string, enum: [paper, news, card]}
              path: {type: string, pattern: '^/'}
              title: {type: string}
              snippet: {type: string}
              score: {type: number, minimum: 0, maximum: 1}
    SurgeonDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, reject]}
    SurgeonDecisionResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [verified, rejected]}
    SurgeonMemberList:
      type: object
      additionalProperties: false
      required: [surgeons]
      properties:
        surgeons:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [accountId, displayName, since]
            properties:
              accountId: {type: string, format: uuid}
              displayName: {type: string}
              since: {type: string, format: date-time}
    TopicSubscriptions:
      type: object
      additionalProperties: false
      required: [topics]
      properties:
        topics:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [mCRC-BRAF-V600E, mCRC-KRAS-G12C, mCRC-MSI-H, mCRC-HER2, mCRC-RAS-wt, generic-CRS, robotic-surgery]
    AccountUpdate:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80, description: Leading and trailing spaces are removed.}
    LikeState:
      type: object
      additionalProperties: false
      required: [likeCount, liked]
      properties:
        likeCount: {type: integer, minimum: 0}
        liked: {type: boolean}
    OwnLikes:
      type: object
      additionalProperties: false
      required: [commentIds]
      properties:
        commentIds:
          type: array
          items: {type: string}
    CommentUpdate:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 2000}
    CommentReceipt:
      type: object
      additionalProperties: false
      required: [id, paperId, status]
      properties:
        id: {type: string}
        paperId: {type: string}
        status:
          type: string
          enum: [pending, published, hidden]
    OwnedComment:
      type: object
      additionalProperties: false
      required: [comment, status]
      properties:
        comment: {$ref: '#/components/schemas/PublicComment'}
        status:
          type: string
          enum: [pending, published, hidden]
      description: Private response for the authenticated owner; never shared-cache this response.
    ReportCreate:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
    ReportReceipt:
      type: object
      additionalProperties: false
      required: [id, commentId]
      properties:
        id: {type: string}
        commentId: {type: string}
    ModerationRequest:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [publish, hide]
          description: publish approves, restores, or keeps a reported comment; hide removes it from readers. Both close
            the comment's open reports.
        reason: {type: string, minLength: 1, maxLength: 1000, description: Kept in the audit record.}
    AuthorRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000, description: Kept in the audit record.}
    AuthorIdentity:
      type: object
      additionalProperties: false
      required: [accountId, displayName]
      properties:
        accountId: {type: string, format: uuid}
        displayName: {type: string, minLength: 1}
      description: Private moderator response; every lookup is recorded with its reason (ADR-0017).
    ModerationItem:
      type: object
      additionalProperties: false
      required: [comment, status, reportCount, reports]
      properties:
        comment: {$ref: '#/components/schemas/PublicComment'}
        status:
          type: string
          enum: [pending, published, hidden]
        reportCount: {type: integer, minimum: 0}
        reports:
          type: array
          description: Open reports only, without who reported.
          items:
            type: object
            additionalProperties: false
            required: [reason, createdAt]
            properties:
              reason: {type: string}
              createdAt: {type: string, format: date-time}
      description: Private moderator response. Does not include the private author mapping.
    ForumPost:
      type: object
      additionalProperties: false
      required: [id, threadId, body, anonymous, displayName, createdAt, updatedAt, likeCount, liked, mine]
      properties:
        id: {type: string, format: uuid}
        body: {type: string, minLength: 1}
        anonymous: {type: boolean}
        displayName:
          type: [string, 'null']
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        likeCount: {type: integer, minimum: 0, description: Number of members who liked it; who they are is never returned.}
        liked: {type: boolean, description: Whether the member making the request liked it.}
        mine: {type: boolean, description: Whether the member making the request wrote it. Shown only to that member.}
        threadId: {type: string, format: uuid}
      allOf:
      - if:
          properties:
            anonymous: {const: true}
        then:
          properties:
            displayName: {type: 'null'}
        else:
          properties:
            displayName: {type: string, minLength: 1}
      description: A reply. Never carries the account behind it; anonymous replies carry no name either.
    ForumOpeningPost:
      type: object
      additionalProperties: false
      required: [id, threadId, title, topicKey, paperId, body, anonymous, displayName, createdAt, updatedAt, likeCount,
        liked, mine, pinned]
      properties:
        id: {type: string, format: uuid}
        body: {type: string, minLength: 1}
        anonymous: {type: boolean}
        displayName:
          type: [string, 'null']
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        likeCount: {type: integer, minimum: 0, description: Number of members who liked it; who they are is never returned.}
        liked: {type: boolean, description: Whether the member making the request liked it.}
        mine: {type: boolean, description: Whether the member making the request wrote it. Shown only to that member.}
        threadId: {type: 'null'}
        title: {type: string, minLength: 1}
        topicKey:
          oneOf:
          - {$ref: '#/components/schemas/TopicKey'}
          - {type: 'null'}
        paperId:
          type: [string, 'null']
          description: The linked paper while it is public; null once it is withdrawn.
        pinned: {type: boolean}
      allOf:
      - if:
          properties:
            anonymous: {const: true}
        then:
          properties:
            displayName: {type: 'null'}
        else:
          properties:
            displayName: {type: string, minLength: 1}
    ForumThreadSummary:
      type: object
      additionalProperties: false
      required: [id, title, topicKey, paperId, anonymous, displayName, createdAt, replyCount, lastReplyAt, likeCount,
        pinned]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, minLength: 1}
        topicKey:
          oneOf:
          - {$ref: '#/components/schemas/TopicKey'}
          - {type: 'null'}
        paperId:
          type: [string, 'null']
        anonymous: {type: boolean}
        displayName:
          type: [string, 'null']
        createdAt: {type: string, format: date-time}
        replyCount: {type: integer, minimum: 0}
        lastReplyAt:
          type: [string, 'null']
          format: date-time
        likeCount: {type: integer, minimum: 0}
        pinned: {type: boolean}
      allOf:
      - if:
          properties:
            anonymous: {const: true}
        then:
          properties:
            displayName: {type: 'null'}
        else:
          properties:
            displayName: {type: string, minLength: 1}
    ForumThreadPage:
      type: object
      additionalProperties: false
      required: [pinned, items, nextCursor]
      properties:
        pinned:
          type: array
          description: Pinned threads, newest pin first, on the first page only (empty when a cursor is given).
          items: {$ref: '#/components/schemas/ForumThreadSummary'}
        items:
          type: array
          items: {$ref: '#/components/schemas/ForumThreadSummary'}
        nextCursor:
          type: [string, 'null']
    ForumThreadDetail:
      type: object
      additionalProperties: false
      required: [thread, replies, nextCursor]
      properties:
        thread: {$ref: '#/components/schemas/ForumOpeningPost'}
        replies:
          type: array
          items: {$ref: '#/components/schemas/ForumPost'}
        nextCursor:
          type: [string, 'null']
    ForumThreadCreate:
      type: object
      additionalProperties: false
      required: [title, body, anonymous]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        body: {type: string, minLength: 1, maxLength: 5000, description: 'Plain text, not HTML; newlines and tabs are
            the only control characters allowed. No information that could identify a patient (ADR-0022).'}
        anonymous: {type: boolean, description: 'true hides the name from other members; the platform keeps the author
            mapping for the author and moderators (ADR-0017).'}
        topicKey:
          oneOf:
          - {$ref: '#/components/schemas/TopicKey'}
          - {type: 'null'}
        paperId:
          type: [string, 'null']
          minLength: 1
          description: A public paper; anything else is 422.
    ForumReplyCreate:
      type: object
      additionalProperties: false
      required: [body, anonymous]
      properties:
        body: {type: string, minLength: 1, maxLength: 5000}
        anonymous: {type: boolean}
    ForumPostUpdate:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 5000}
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Opening posts only; 422 on a reply.
    ForumPostReceipt:
      type: object
      additionalProperties: false
      required: [id, threadId, status]
      properties:
        id: {type: string, format: uuid}
        threadId: {type: string, format: uuid, description: The thread; equal to id for an opening post.}
        status:
          type: string
          enum: [pending, published, hidden]
    ForumReportReceipt:
      type: object
      additionalProperties: false
      required: [id, postId]
      properties:
        id: {type: string, format: uuid}
        postId: {type: string, format: uuid}
    ForumPostRecord:
      type: object
      additionalProperties: false
      required: [id, threadId, title, body, anonymous, displayName, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        threadId:
          type: [string, 'null']
          format: uuid
        title:
          type: [string, 'null']
        body: {type: string}
        anonymous: {type: boolean}
        displayName:
          type: [string, 'null']
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      description: A post outside its thread, as its author or the maintainer sees it. Never carries the account.
    ForumOwnPostPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [post, status]
            properties:
              post: {$ref: '#/components/schemas/ForumPostRecord'}
              status:
                type: string
                enum: [pending, hidden]
        nextCursor:
          type: [string, 'null']
    ForumAdminThreadPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [post, status, pinned, replyCount]
            properties:
              post: {$ref: '#/components/schemas/ForumPostRecord'}
              status:
                type: string
                enum: [pending, published, hidden]
              pinned: {type: boolean}
              replyCount: {type: integer, minimum: 0, description: Replies members can see.}
        nextCursor:
          type: [string, 'null']
      description: Private moderator response. Does not include the private author mapping.
    ForumPinRequest:
      type: object
      additionalProperties: false
      required: [pinned, reason]
      properties:
        pinned: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 1000, description: Recorded in the moderation audit trail.}
    ForumPinState:
      type: object
      additionalProperties: false
      required: [id, pinned]
      properties:
        id: {type: string, format: uuid}
        pinned: {type: boolean}
    ForumModerationItem:
      type: object
      additionalProperties: false
      required: [post, threadTitle, status, reportCount, reports]
      properties:
        post: {$ref: '#/components/schemas/ForumPostRecord'}
        threadTitle:
          type: [string, 'null']
          description: The title of the thread a reply belongs to; null for an opening post.
        status:
          type: string
          enum: [pending, published, hidden]
        reportCount: {type: integer, minimum: 0}
        reports:
          type: array
          description: Open reports only, without who reported.
          items:
            type: object
            additionalProperties: false
            required: [reason, createdAt]
            properties:
              reason: {type: string}
              createdAt: {type: string, format: date-time}
      description: Private moderator response. Does not include the private author mapping.
    ForumModerationItemPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ForumModerationItem'}
        nextCursor:
          type: [string, 'null']
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [validation_error, not_found, unauthenticated, forbidden, rate_limited, conflict, unavailable]
            message: {type: string}
            requestId: {type: string}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    PaperPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Paper'}
        nextCursor:
          type: [string, 'null']
    NewsPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/News'}
        nextCursor:
          type: [string, 'null']
    TopicPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Topic'}
        nextCursor:
          type: [string, 'null']
    SearchHitPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SearchHit'}
        nextCursor:
          type: [string, 'null']
    PublicCommentPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PublicComment'}
        nextCursor:
          type: [string, 'null']
    OwnedCommentPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/OwnedComment'}
        nextCursor:
          type: [string, 'null']
    ModerationItemPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ModerationItem'}
        nextCursor:
          type: [string, 'null']
    NewsReview:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [auto, accepted]
        publishedAt: {type: string, format: date}
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Not authorized or mode unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Conflicting state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Rate limited
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: >-
        Service unavailable. With Retry-After, writes are paused for planned maintenance (reads keep working);
        without it, a dependency such as the database is down.
      headers:
        Retry-After:
          description: Seconds until writes are expected to reopen; only sent during planned maintenance.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
