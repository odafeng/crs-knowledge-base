openapi: 3.1.1
info: {title: GutHub API contract, version: 0.1.0, description: Provider-neutral planned contract. No server or
    authentication provider is implemented by this specification. Identity modes and publication policy remain subject
    to A1/A2.}
servers:
- {url: /api/v1}
security: []
paths:
  /health:
    get:
      operationId: health
      summary: health
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /papers:
    get:
      operationId: listPapers
      summary: listPapers
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaperPage'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: topic
        in: query
        schema: {$ref: '#/components/schemas/TopicKey'}
  /papers/{paperId}:
    get:
      operationId: getPaper
      summary: getPaper
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Paper'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/PaperId'}
  /news:
    get:
      operationId: listNews
      summary: listNews
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NewsPage'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
  /news/{newsId}:
    get:
      operationId: getNews
      summary: getNews
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/News'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/NewsId'}
  /topics:
    get:
      operationId: listTopics
      summary: listTopics
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TopicPage'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
  /topics/{topicKey}:
    get:
      operationId: getTopic
      summary: getTopic
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Topic'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/TopicKey'}
  /search:
    get:
      operationId: search
      summary: search
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchHitPage'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: q
        in: query
        required: true
        schema: {type: string, minLength: 2}
  /semantic-search:
    post:
      operationId: semanticSearch
      summary: Natural-language search over papers, news and treatment cards (H3); 503 when not configured or the
        month's embedding budget is spent, so the site falls back to keyword search.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SemanticQuery'}
      responses:
        '200':
          description: Success. Passages below the relevance threshold are omitted, so the list may be empty.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SemanticResults'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      description: 'The query is in the body so it stays out of request logs; it is not stored. Set Cache-Control:
        no-store.'
  /papers/{paperId}/comments:
    get:
      operationId: listComments
      summary: List only published comments; anonymous author mappings are never returned.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicCommentPage'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/PaperId'}
    post:
      operationId: createComment
      summary: createComment
      security:
      - BearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/PaperId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommentCreate'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Ownership and allowed identity
        modes are checked server-side.'
  /me:
    get:
      operationId: getAccount
      summary: The signed-in reader's display name and role; displayName is null until the reader chooses one.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. The admin role is read from the
        database, never from token claims or user metadata.'
    put:
      operationId: updateAccount
      summary: Choose or change the public display name; creates the account on first use.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountUpdate'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. 409 when the account was
        deleted.'
  /me/comments:
    get:
      operationId: listOwnComments
      summary: listOwnComments
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnedCommentPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Ownership and allowed identity
        modes are checked server-side.'
  /comments/{commentId}:
    patch:
      operationId: updateOwnComment
      summary: updateOwnComment
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/CommentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommentUpdate'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Ownership and allowed identity
        modes are checked server-side.'
    delete:
      operationId: deleteOwnComment
      summary: deleteOwnComment
      security:
      - BearerAuth: []
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/CommentId'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Ownership and allowed identity
        modes are checked server-side.'
  /comments/{commentId}/reports:
    post:
      operationId: reportComment
      summary: reportComment
      security:
      - BearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/CommentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportCreate'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Ownership and allowed identity
        modes are checked server-side.'
  /comments/{commentId}/likes:
    put:
      operationId: likeComment
      summary: Like a visible comment by someone else; repeating it changes nothing.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LikeState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/CommentId'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Needs an account with a display
        name; own comments cannot be liked.'
    delete:
      operationId: unlikeComment
      summary: Remove the reader's like; repeating it changes nothing.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LikeState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/CommentId'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store.'
  /me/likes:
    get:
      operationId: listOwnLikes
      summary: Visible comments on one paper that the reader has liked.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnLikes'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - name: paperId
        in: query
        required: true
        schema: {type: string, minLength: 1}
      description: 'Requires a verified session. Set Cache-Control: private, no-store.'
  /admin/comments:
    get:
      operationId: listModerationQueue
      summary: listModerationQueue
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModerationItemPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Requires the comments:moderate
        permission; clients cannot grant themselves this permission.'
      x-required-permission: comments:moderate
  /admin/comments/{commentId}:
    patch:
      operationId: moderateComment
      summary: moderateComment
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/CommentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModerationRequest'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Requires the comments:moderate
        permission; clients cannot grant themselves this permission.'
      x-required-permission: comments:moderate
  /admin/comments/{commentId}/author:
    post:
      operationId: revealCommentAuthor
      summary: Look up who wrote a comment, with a reason that is recorded before the answer is returned.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorIdentity'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
      parameters:
      - {$ref: '#/components/parameters/CommentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorRequest'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Requires the comments:moderate
        permission; clients cannot grant themselves this permission. 404 once the mapping is purged.'
      x-required-permission: comments:moderate
  /push/subscription:
    put:
      operationId: subscribePush
      summary: Store this browser's Web Push subscription for new stories; repeating it renews the keys.
      security: []
      responses:
        '204': {description: Stored}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PushSubscription'}
      description: 'No sign-in: a subscription names a browser and is never linked to an account. Set Cache-Control:
        no-store.'
    delete:
      operationId: unsubscribePush
      summary: Forget this browser's subscription; answers the same whether or not it was stored.
      security: []
      responses:
        '204': {description: Removed}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PushEndpoint'}
      description: 'Set Cache-Control: no-store.'
  /admin/stats/weekly:
    get:
      operationId: getWeeklyActivity
      summary: Counts per week for the last 12 weeks; no reader is listed.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeeklyActivity'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Requires the comments:moderate
        permission. An active reader commented, liked or reported that week; weeks start on Monday, Asia/Taipei.'
      x-required-permission: comments:moderate
  /admin/content-requests:
    post:
      operationId: requestContentChange
      summary: Mark an auto-published paper or story reviewed, or take it down; applied by the content writer job.
      security:
      - BearerAuth: []
      responses:
        '202':
          description: Recorded; started says whether the job was started now or the request waits for its next run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentRequestQueued'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentRequest'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Requires the comments:moderate
        permission. The API never writes content itself (ADR-0021).'
      x-required-permission: comments:moderate
  /me/surgeon:
    get:
      operationId: getSurgeonMembership
      summary: Whether the signed-in reader is a verified colorectal surgeon member, or has applied.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SurgeonMembership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store.'
    put:
      operationId: applyForSurgeonMembership
      summary: Apply, or replace a pending application; 403 until a display name is chosen, 409 once verified.
      security:
      - BearerAuth: []
      responses:
        '202':
          description: Accepted. Pending review, or verified at once when the society's doctor map lists the name at
            the hospital and the session was opened from a link mailed to that hospital's domain (H10).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SurgeonMembership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Conflict'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SurgeonApplication'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. The details are deleted once
        the application is decided or withdrawn.'
    delete:
      operationId: withdrawSurgeonApplication
      summary: Withdraw a pending application and delete its details; a verified membership is unaffected.
      security:
      - BearerAuth: []
      responses:
        '204': {description: Withdrawn}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store.'
  /admin/surgeon-applications:
    get:
      operationId: listSurgeonApplications
      summary: Pending applications, oldest first, with the details the maintainer checks.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SurgeonApplicationList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Requires the comments:moderate
        permission.'
      x-required-permission: comments:moderate
  /admin/surgeon-applications/{accountId}:
    post:
      operationId: decideSurgeonApplication
      summary: Approve or reject; the application and its details are deleted either way.
      security:
      - BearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/AccountId'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SurgeonDecisionResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/NotFound'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SurgeonDecision'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Requires the comments:moderate
        permission. Records who decided, never the details.'
      x-required-permission: comments:moderate
  /admin/surgeons:
    get:
      operationId: listSurgeonMembers
      summary: Verified colorectal surgeon members.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SurgeonMemberList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
      description: 'Requires a verified session. Set Cache-Control: private, no-store. Requires the comments:moderate
        permission.'
      x-required-permission: comments:moderate
  /admin/surgeons/{accountId}:
    delete:
      operationId: revokeSurgeonMembership
      summary: Revoke a membership; recorded in the audit trail.
      security:
      - BearerAuth: []
      parameters:
      - {$ref: '#/components/parameters/AccountId'}
      responses:
        '204': {description: Revoked}
