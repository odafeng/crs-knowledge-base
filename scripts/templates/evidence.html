<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; line-height: 1.7; color: #1a202c; background: #fff; }
h1 { font-size: 1.3rem; color: #1a365d; border-bottom: 2px solid #3182ce; padding-bottom: 8px; }
h2 { font-size: 1.1rem; color: #2c5282; margin-top: 24px; }
.meta { background: #f7fafc; padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 0.88rem; color: #4a5568; }
.meta a { color: #3182ce; }
table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.85rem; }
th, td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: left; }
th { background: #edf2f7; color: #1a365d; }
.note { background: #fffbeb; border-left: 3px solid #d69e2e; padding: 8px 12px; margin: 12px 0; border-radius: 0 6px 6px 0; }
p { margin: 8px 0; }
</style>
</head>
<body>

<h1>{{title}}</h1>

<div class="meta">
<strong>Authors:</strong> {{authors}}<br>
<strong>Journal:</strong> <em>{{journal}}</em> {{year}}<br>
<strong>DOI:</strong> <a href="https://doi.org/{{doi}}">{{doi}}</a><br>
<strong>PMID:</strong> {{pmid}}<br>
<strong>Study:</strong> {{study_name}} ({{study_type}})
</div>

<h2>Abstract</h2>

<p><strong>Design:</strong> {{design}}</p>

<p><strong>Arms:</strong></p>
<ul>
{{arms}}
</ul>

<h2>Key Results</h2>

<table>
<tr>
<th>Endpoint</th>
<th>Experimental</th>
<th>Control</th>
</tr>
{{results_rows}}
</table>

<h2>Conclusions</h2>

<p>{{conclusions}}</p>

</body>
</html>
