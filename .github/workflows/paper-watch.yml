name: Paper Watch

on:
  schedule:
    # Daily full scan at UTC 08:00 (Taiwan 16:00) (K1 #251)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Single topic to scan (leave empty for all)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no issues created)'
        required: false
        type: boolean
        default: false
      bootstrap:
        description: 'Bootstrap mode: seed topic with 2-year history'
        required: false
        type: boolean
        default: false

# Every workflow that writes to main shares this group, so pushes never race.
concurrency:
  group: kb-main-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      actions: write  # dispatch CI so auto-published papers deploy

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Configure git
        run: |
          git config user.name "paper-watch[bot]"
          git config user.email "bot@users.noreply.github.com"

      - name: Run paper-watch pipeline
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.topic }}" ]; then
            ARGS="$ARGS --topic ${{ inputs.topic }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            ARGS="$ARGS --bootstrap"
          fi
          python main.py $ARGS

      - name: Commit tracking files and auto-published KB updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "paper-watch[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/tracked-dois.json data/tracked-abstracts.json data/papers.json docs
          if git diff --cached --quiet; then exit 0; fi
          DEPLOY=false
          if git diff --cached --quiet -- data/papers.json; then
            git commit -m "chore: update tracked DOIs [paper-watch]"
          else
            git commit -m "kb: auto-publish from paper-watch [paper-watch]"
            DEPLOY=true
          fi
          git pull --rebase
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows; dispatch CI so the site deploys.
          if [ "$DEPLOY" = true ]; then gh workflow run ci.yml --ref main; fi
