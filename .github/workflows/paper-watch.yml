name: Paper Watch

on:
  schedule:
    # Regular scan: Tuesday & Friday at UTC 08:00 (Taiwan 16:00)
    - cron: '0 8 * * 2,5'
    # Daily scan: for conference season (script auto-skips if not in season)
    - cron: '0 8 * * 1,3,4,6,0'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Single topic to scan (leave empty for all)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no issues created)'
        required: false
        type: boolean
        default: false
      bootstrap:
        description: 'Bootstrap mode: seed topic with 2-year history'
        required: false
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine scan mode
        id: mode
        run: |
          # Tuesday & Friday = regular full scan
          # Other days = daily (conference season only)
          DOW=$(date +%u)
          if [ "$DOW" = "2" ] || [ "$DOW" = "5" ]; then
            echo "daily=false" >> $GITHUB_OUTPUT
          else
            echo "daily=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure git for auto-PR
        run: |
          git config user.name "paper-watch[bot]"
          git config user.email "bot@users.noreply.github.com"

      - name: Run paper-watch pipeline
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ARGS=""
          if [ "${{ steps.mode.outputs.daily }}" = "true" ]; then
            ARGS="$ARGS --daily"
          fi
          if [ -n "${{ inputs.topic }}" ]; then
            ARGS="$ARGS --topic ${{ inputs.topic }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            ARGS="$ARGS --bootstrap"
          fi
          python main.py $ARGS

      - name: Commit updated tracking files
        run: |
          git config user.name "paper-watch[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/tracked-dois.json data/tracked-abstracts.json
          git diff --cached --quiet || git commit -m "chore: update tracked DOIs [paper-watch]"
          git pull --rebase
          git push
