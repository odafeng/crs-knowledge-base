name: Refresh Guidelines

on:
  schedule:
    # Monthly: 1st of each month at UTC 10:00 (Taiwan 18:00)
    - cron: '0 10 1 * *'
  workflow_dispatch: # Manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install playwright
          playwright install chromium

      - name: Refresh guideline cache
        working-directory: scripts
        env:
          OE_COOKIES_JSON: ${{ secrets.OE_COOKIES_JSON }}
        run: python refresh_guidelines.py

      - name: Commit updated cache
        run: |
          git config user.name "paper-watch[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/guidelines/
          git diff --cached --quiet || git commit -m "chore: refresh guideline cache [openevidence]"
          git push
