name: Publish Accepted Issue

# A reviewer adds the `accepted` label to a held paper or commentary issue;
# this publishes it with review status "accepted" (ADR-0013).
on:
  issues:
    types: [labeled]

concurrency:
  group: kb-main-writes
  cancel-in-progress: false

jobs:
  writer:
    # Only the `accepted` label, and only on issues the pipeline opened: github-actions before cutover, the
    # repository owner's token that Paper Watch uses on Cloud Run after it.
    if: >-
      github.event.label.name == 'accepted' &&
      (github.event.issue.user.type == 'Bot' || github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      writer: ${{ steps.flag.outputs.writer }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: data/WRITER
          sparse-checkout-cone-mode: false
      - id: flag
        run: echo "writer=$(cat data/WRITER 2>/dev/null || echo json)" >> "$GITHUB_OUTPUT"

  # Before cutover: edit the JSON and commit it.
  publish:
    needs: writer
    if: needs.writer.outputs.writer == 'json'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Apply issue to KB
        id: apply
        working-directory: scripts
        run: |
          gh issue view "$ISSUE" --json body -q .body > "$RUNNER_TEMP/body.md"
          python accept_issue.py --body-file "$RUNNER_TEMP/body.md" --result-file "$RUNNER_TEMP/result.md" --issue "$ISSUE"

      - name: Commit, push, deploy
        run: |
          git config user.name "paper-watch[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/papers.json docs
          git commit -m "kb: $(cat "$RUNNER_TEMP/result.md") (accepted in #$ISSUE)"
          git pull --rebase
          git push
          gh workflow run ci.yml --ref main
          gh issue comment "$ISSUE" --body "已發布：$(cat "$RUNNER_TEMP/result.md")。網站部署完成後即可看到；要撤下請到 Actions 執行 Unpublish。"
          gh issue close "$ISSUE" --reason completed

      - name: Report failure on the issue
        if: failure() && steps.apply.outcome == 'failure'
        run: gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/result.md"

  # After cutover the database is the only writer (ADR-0021); Cloud Run publishes, comments and closes the issue.
  start-job:
    needs: writer
    if: needs.writer.outputs.writer == 'postgres'
    runs-on: ubuntu-latest
    environment: content
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/392767072259/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: content-trigger@guthub-prod.iam.gserviceaccount.com
          token_format: access_token

      # content-trigger may only run this job, without overrides: the job reads the request from the issue.
      - name: Start the content requests job
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Length: 0" \
            https://run.googleapis.com/v2/projects/guthub-prod/locations/asia-northeast1/jobs/content-requests:run >/dev/null
