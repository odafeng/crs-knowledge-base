name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Bot pushes made with GITHUB_TOKEN don't trigger `push`; the KB-writing workflows dispatch this instead.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt -r requirements-dev.txt -r pilot/requirements.txt

      - name: Validate data integrity
        run: python scripts/validate.py --ci

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.115.0

      # The content import tests (import_content.py) need the app schema; only the database is required here.
      - name: Start local Supabase database
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export test database URL
        run: supabase status -o env | tr -d '"' | sed -n 's/^DB_URL=/GUTHUB_TEST_DATABASE_URL=/p' >> "$GITHUB_ENV"

      - name: Run tests
        env:
          GUTHUB_REQUIRE_DB: '1'
        run: python -m pytest tests/ -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tools/package-lock.json

      - name: Install Next.js dependencies
        working-directory: apps/web
        run: npm ci

      - name: Check contract, types, lint, format, and unit tests
        working-directory: apps/web
        run: npm run check

      - name: Audit runtime dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Install browser test tools
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test Next.js startup and reader shell
        working-directory: apps/web
        run: npm run smoke

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv==0.10.12

      - name: Install locked API dependencies
        run: uv sync --frozen

      - name: Lint and format
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen pyright

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.115.0

      - name: Start local Supabase (database, Data API, auth)
        working-directory: .
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Re-run migrations on a clean database
        working-directory: .
        run: supabase db reset

      # Local Supabase uses fixed, public demo keys; none of these are secrets.
      - name: Export test database settings
        working-directory: .
        run: |
          supabase status -o env | tr -d '"' | sed -n \
            -e 's/^DB_URL=/GUTHUB_TEST_DATABASE_URL=/p' \
            -e 's/^API_URL=/GUTHUB_TEST_SUPABASE_URL=/p' \
            -e 's/^REST_URL=/GUTHUB_TEST_REST_URL=/p' \
            -e 's/^ANON_KEY=/GUTHUB_TEST_ANON_KEY=/p' \
            -e 's/^SERVICE_ROLE_KEY=/GUTHUB_TEST_SERVICE_KEY=/p' >> "$GITHUB_ENV"

      - name: Unit, contract, smoke, and database tests
        env:
          GUTHUB_REQUIRE_DB: '1'
        run: uv run --frozen pytest -v

      # The images deploy-staging.yml ships (E3 #76): the API answers health, the worker starts.
      - name: Container images build and start
        working-directory: .
        run: |
          docker build -q -t guthub-api:ci apps/api
          docker run -d --name api-ci -p 18080:8080 -e GUTHUB_ENVIRONMENT=test guthub-api:ci
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:18080/api/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/api/v1/health
          docker rm -f api-ci
          docker build -q -f worker/Dockerfile -t guthub-worker:ci .
          docker run --rm guthub-worker:ci --help | grep -q -- --dry-run

  # Full-stack Next.js E2E against local Supabase + FastAPI (C2d #93, K9 #259): axe, reading flow, auth, comments, forum.
  e2e:
    runs-on: ubuntu-latest
    env:
      API_PORT: '8000'
      WEB_PORT: '3000'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv and pipeline dependencies
        run: pip install uv==0.10.12 -r scripts/requirements.txt

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.115.0

      # Auth and Mailpit too: sign-in (D1 #67) is tested with a real email link. Local demo keys are not secrets.
      - name: Start local Supabase (database, Auth, Mailpit)
        run: |
          supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase status -o env | tr -d '"' | sed -n \
            -e 's/^API_URL=/SUPABASE_URL=/p' \
            -e 's/^PUBLISHABLE_KEY=/SUPABASE_PUBLISHABLE_KEY=/p' \
            -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_KEY=/p' \
            -e 's/^MAILPIT_URL=/MAILPIT_URL=/p' \
            -e 's/^DB_URL=/DATABASE_URL=/p' >> "$GITHUB_ENV"

      - name: Import content and start the API as guthub_api
        run: |
          DB_URL=$(supabase status -o env | tr -d '"' | sed -n 's/^DB_URL=//p')
          (cd apps/api && uv sync --frozen)
          apps/api/.venv/bin/python import_content.py --database-url "$DB_URL" > /dev/null
          cd apps/api
          GUTHUB_DATABASE_URL="${DB_URL}?options=-c%20role%3Dguthub_api" GUTHUB_SUPABASE_URL="$SUPABASE_URL" \
            GUTHUB_CORS_ORIGINS="[\"http://127.0.0.1:$WEB_PORT\"]" nohup .venv/bin/uvicorn guthub_api.main:app \
            --port "$API_PORT" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$API_PORT/api/v1/health" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tools/package-lock.json

      # Public mode so per-page noindex can be compared with the current site.
      - name: Build and start Next.js
        env:
          GUTHUB_SITE_PUBLIC: '1'
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          export NEXT_PUBLIC_GUTHUB_API_URL="http://127.0.0.1:$API_PORT/api/v1"
          # A throwaway VAPID public key: shows the push button; nothing can be sent without its private half.
          export NEXT_PUBLIC_PUSH_PUBLIC_KEY=BBCf_J7V3OaA9yQDGiFumEWmHn8L3tIEgxtzJ9eQF88pLtEg5HCUiKlA4Q-s-AUjeOQ_4ddzzq6TTNER80QcsOY
          cd apps/web
          npm ci
          npm run build
          GUTHUB_API_URL="http://127.0.0.1:$API_PORT/api/v1" nohup npm run start -- --port "$WEB_PORT" > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$WEB_PORT/api/health" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/web.log"; exit 1

      - name: Install browser test tools
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Accessibility and the reading flow
        run: node tools/next-verify.js "http://127.0.0.1:$WEB_PORT"

      - name: Search, reading preferences and offline reading
        run: node tools/next-offline.js "http://127.0.0.1:$WEB_PORT"

      - name: Sign-in, account name, sign-out and switching accounts
        run: node tools/next-auth.js "http://127.0.0.1:$WEB_PORT" "http://127.0.0.1:$API_PORT/api/v1"

      # DATABASE_URL approves the first comment, standing in for moderation (D5).
      - name: Web Push subscribe, notification and unsubscribe (no push service)
        run: node tools/next-push.js "http://127.0.0.1:$WEB_PORT"

      - name: Reader discussion on paper pages
        run: node tools/next-comments.js "http://127.0.0.1:$WEB_PORT" "http://127.0.0.1:$API_PORT/api/v1"

      # DATABASE_URL grants surgeon membership and the admin flag, standing in for H5 verification.
      - name: Colorectal surgeon forum
        run: node tools/next-forum.js "http://127.0.0.1:$WEB_PORT" "http://127.0.0.1:$API_PORT/api/v1"

      # DATABASE_URL grants the reviewer the admin flag; applying, approving, rejecting and revoking go through the UI.
      - name: Colorectal surgeon verification
        run: node tools/next-surgeons.js "http://127.0.0.1:$WEB_PORT" "http://127.0.0.1:$API_PORT/api/v1"

      # DATABASE_URL reads the follows and the digest token a real digest would carry in its links.
      - name: Following papers and the digest's unsubscribe links
        run: node tools/next-follows.js "http://127.0.0.1:$WEB_PORT"
