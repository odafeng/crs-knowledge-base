name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Bot pushes made with GITHUB_TOKEN don't trigger `push`; the KB-writing workflows dispatch this instead.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt -r requirements-site.txt -r requirements-dev.txt

      - name: Validate data integrity
        run: python scripts/validate.py --ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # The content import tests (import_content.py) need the app schema; only the database is required here.
      - name: Start local Supabase database
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export test database URL
        run: supabase status -o env | tr -d '"' | sed -n 's/^DB_URL=/GUTHUB_TEST_DATABASE_URL=/p' >> "$GITHUB_ENV"

      - name: Run tests
        env:
          GUTHUB_REQUIRE_DB: '1'
        run: python -m pytest tests/ -v

      - name: Build replacement site
        env:
          PUSH_PUBLIC_KEY: ${{ vars.PUSH_PUBLIC_KEY }}
          PUSH_API: ${{ vars.PUSH_API }}
          PUSH_API_KEY: ${{ vars.PUSH_API_KEY }}
        run: python build.py

      - name: Check generated links
        run: python tools/check_links.py site

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install browser test tools
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test reader flows and offline use
        working-directory: tools
        run: npm test

      - name: Check accessibility and responsive layouts
        working-directory: tools
        run: npm run verify

      - name: Save built site
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: site

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tools/package-lock.json

      - name: Install Next.js dependencies
        working-directory: apps/web
        run: npm ci

      - name: Check contract, types, lint, format, and unit tests
        working-directory: apps/web
        run: npm run check

      - name: Audit runtime dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build

      - name: Install browser test tools
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test Next.js startup and reader shell
        working-directory: apps/web
        run: npm run smoke

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv==0.10.12

      - name: Install locked API dependencies
        run: uv sync --frozen

      - name: Lint and format
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen pyright

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start local Supabase (database, Data API, auth)
        working-directory: .
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Re-run migrations on a clean database
        working-directory: .
        run: supabase db reset

      # Local Supabase uses fixed, public demo keys; none of these are secrets.
      - name: Export test database settings
        working-directory: .
        run: |
          supabase status -o env | tr -d '"' | sed -n \
            -e 's/^DB_URL=/GUTHUB_TEST_DATABASE_URL=/p' \
            -e 's/^REST_URL=/GUTHUB_TEST_REST_URL=/p' \
            -e 's/^ANON_KEY=/GUTHUB_TEST_ANON_KEY=/p' \
            -e 's/^SERVICE_ROLE_KEY=/GUTHUB_TEST_SERVICE_KEY=/p' >> "$GITHUB_ENV"

      - name: Unit, contract, smoke, and database tests
        env:
          GUTHUB_REQUIRE_DB: '1'
        run: uv run --frozen pytest -v

  deploy:
    needs: [test, web, api]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: built-site
          path: site

      - name: Verify Actions publishing source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" = workflow

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
