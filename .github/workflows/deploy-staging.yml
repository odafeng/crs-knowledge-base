name: Deploy staging

# Every change on main that touches the API, the jobs or the database goes to staging (E3 #76). The steps live in
# deploy.yml, shared with production.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'worker/**'
      - 'scripts/**'
      - 'sitegen/**'
      - 'newsroom/**'
      - 'import_content.py'
      - 'content_writer.py'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      project: guthub-staging
      project_number: '687867762639'
      supabase_ref: dlfhqneoqxlelczqcxif
