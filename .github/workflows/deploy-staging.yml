name: Deploy staging

# Staging is the rehearsal for what is hard to undo (ADR-0024): database migrations, Supabase settings, how sign-in
# tokens are verified, and the deployment itself. Other changes go from CI straight to production, so staging need
# not carry every feature's secrets. Deploy production refuses to run until staging has taken any such change. The
# steps live in deploy.yml, shared with production.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'apps/api/src/guthub_api/auth.py'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      project: guthub-staging
      project_number: '687867762639'
      supabase_ref: dlfhqneoqxlelczqcxif
      supabase_pooler: aws-0-ap-northeast-1.pooler.supabase.com
