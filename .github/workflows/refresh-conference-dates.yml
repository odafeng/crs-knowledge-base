name: Refresh Conference Dates

on:
  schedule:
    # Quarterly: Jan 1, Apr 1, Jul 1, Oct 1 at UTC 10:00
    - cron: '0 10 1 1,4,7,10 *'
  workflow_dispatch: # Manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Refresh conference dates
        working-directory: scripts
        run: python refresh_conference_dates.py

      - name: Commit if changed
        run: |
          git config user.name "paper-watch[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/queries.json
          git diff --cached --quiet || git commit -m "chore: update conference dates [auto-scraped]"
          git push
