repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: web-check
        name: Next.js contract, types, lint, format, and unit tests
        entry: npm --prefix apps/web run check
        language: system
        pass_filenames: false
        files: ^(apps/web/|contracts/openapi\.yaml$)

      - id: api-check
        name: FastAPI lint, format, types, and tests
        entry: bash -c 'cd apps/api && uv run --frozen ruff check . && uv run --frozen ruff format --check . && uv run --frozen pyright && uv run --frozen pytest -q'
        language: system
        pass_filenames: false
        files: ^(apps/api/|contracts/openapi\.yaml$)

      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: validate-data
        name: validate papers.json
        entry: python scripts/validate.py --ci
        language: system
        pass_filenames: false
        files: ^data/papers\.json$

      - id: pytest
        name: pytest
        entry: python -m pytest tests/ -q
        language: system
        pass_filenames: false
        stages: [pre-push]
