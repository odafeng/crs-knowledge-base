[project]
name = "guthub-api"
version = "0.1.0"
description = "GutHub FastAPI service (ADR-0016)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "nh3>=0.2",
  "psycopg-pool>=3.2",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "httpx2>=2.16",
  "jsonschema>=4.23",
  "pyright==1.1.414",
  "pytest>=8.3",
  "pyyaml>=6.0",
  "ruff==0.11.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guthub_api"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["guthub_api"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
